<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Webカメラ表示</title>
<style>
  body {
    font-family: sans-serif;
    background: #1e1e1e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
  }
  h1 {
    font-size: 1.2rem;
    font-weight: 500;
  }
  video {
    width: 100%;
    max-width: 640px;
    border-radius: 8px;
    background: #000;
  }
  #status {
    margin-top: 1rem;
    color: #aaa;
    font-size: 0.9rem;
  }
  button {
    margin-top: 1rem;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    border: 1px solid #555;
    background: #2a2a2a;
    color: #eee;
    cursor: pointer;
  }
  button:hover {
    background: #333;
  }
</style>
</head>
<body>
  <h1>Webカメラ映像</h1>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>
  <!-- <canvas id="canvas2" style="display:none;"></canvas> -->
  <div>
    <button id="startBtn">カメラを開始</button>
    <button id="captureBtn" disabled>PNGとして保存</button>
    <form>
      <button id="test" disabled>test</button>
    </form>
  </div>
  <p id="status">カメラは停止中です</p>
  <img id="preview" style="max-width:640px; width:100%; display:none; border-radius:8px; margin-top:1rem;">
  <a id="downloadLink" style="display:none; margin-top:0.5rem; color:#6cf;" download>この画像をダウンロード</a>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const canvas2 = document.getElementById('canvas2');
  const status = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const captureBtn = document.getElementById('captureBtn');
  const preview = document.getElementById('preview');
  const downloadLink = document.getElementById('downloadLink');
  const test = document.getElementById('test');

  let capturedBlob =null;
  let stream = null;
  // 直近にキャプチャしたPNG画像のURL（Blob URL）を保持する変数
  let capturedImageUrl = null;

  /**
   * バックエンド(server.js)のオリジンを実行時に解決する。
   * GitHub CodespacesはCodespaceごとにランダムなサブドメイン名
   * (例: vigilant-acorn-xxxx)が割り当てられ、ポート番号だけが
   * "-3000"/"-5000"のように末尾に付与される。この名前はCodespaceを
   * 作り直す度（例: iOSのCodespacesアプリから開いた場合）に変わるため、
   * バックエンドURLをハードコードすると別のCodespaceでは存在しない
   * ホストへfetchすることになり "TypeError: Load failed" になる。
   * そのため、現在ページを開いているオリジンから同じCodespace上の
   * バックエンド(ポート5000)のオリジンを組み立てる。
   */
  function resolveBackendOrigin() {
    const { protocol, hostname, port, origin } = window.location;

    // 例: vigilant-acorn-xxxx-3000.app.github.dev -> vigilant-acorn-xxxx-5000.app.github.dev
    const codespacesMatch = hostname.match(/^(.*)-\d+(\.app\.github\.dev|\.githubpreview\.dev|\.preview\.app\.github\.dev)$/);
    if (codespacesMatch) {
      return `${protocol}//${codespacesMatch[1]}-5000${codespacesMatch[2]}`;
    }

    // ローカル環境などポート番号でしか区別できない場合
    if (port && port !== '5000') {
      return `${protocol}//${hostname}:5000`;
    }

    return origin;
  }

  const BACKEND_ORIGIN = resolveBackendOrigin();
  const UPLOAD_URL = BACKEND_ORIGIN + '/files';
  console.log('[config] BACKEND_ORIGIN =', BACKEND_ORIGIN);

  const BASE_URL = 'https://yce-api-01.makeupar.com/s2s/v2.0/task/aging';
  const START_METHOD = 'POST';
  const HEADERS = {
    "Content-Type": "application/json",
    "Authorization": "Bearer sk-Iui7UQeJWRSml-T46BzQnoAOp2gcP0YRdhFIH5e5794MdO-sy530yJ4018Qj9284"
  };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function startTask(image) {
    alert(image);
    const init = {
      method: START_METHOD,
      headers: HEADERS,
      body: JSON.stringify({
        "request_id": 0,
        "src_file_url": image
      }),
    };

    const res = await fetch(BASE_URL, init);
    if (!res.ok) {
      throw new Error(`Start request failed: ${res.status} ${res.statusText}`);
    }

    const payload = await res.json().catch(() => ({}));
    const taskId = payload?.data?.task_id;
    if (!taskId) {
      throw new Error('task_id not found in response: ' + JSON.stringify(payload));
    }

    console.log('[startTask] Task started, id =', taskId);
    return taskId;
  }

  async function pollTask(taskId, { intervalMs = 2000, maxAttempts = 300 } = {}) {
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      const pollUrl = BASE_URL + '/' + taskId;
      const res = await fetch(pollUrl, { method: 'GET', headers: HEADERS });

      if (!res.ok) {
        throw new Error(`Polling failed: ${res.status} ${res.statusText}`);
      }

      const payload = await res.json().catch(() => ({}));
      const status = payload?.data?.task_status;
      console.log('[pollTask] Attempt', attempt, 'status =', status);

      if (status === 'success') {
        const results = payload?.data?.results;
        console.log('[pollTask] Success results:', results);
        return payload;
      }
      if (status === 'error') {
        throw new Error('Task failed: ' + JSON.stringify(payload));
      }

      await sleep(intervalMs);
    }
    throw new Error('Max attempts exceeded while polling');
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }
  /**
   * 送信用の画像データURL（base64 data URL）を文字列として取得する
   * @param {Blob} blob - PNG画像のBlobデータ
   * @returns {Promise<string>} data URL文字列
   */
  async function getSendableImageUrl(blob) {
    return await blobToBase64(blob);
  }

  async function resizeToJpegUnderSize(blob, maxBytes = 10 * 1024 * 1024) {
    const imageBitmap = await createImageBitmap(blob);
    let width = imageBitmap.width;
    let height = imageBitmap.height;
    let quality = 0.92;
    let resultBlob = null;
 
    for (let attempt = 0; attempt < 8; attempt++) {
      const resizeCanvas = document.createElement('canvas');
      resizeCanvas.width = width;
      resizeCanvas.height = height;
      const ctx = resizeCanvas.getContext('2d');
      ctx.drawImage(imageBitmap, 0, 0, width, height);
 
      resultBlob = await new Promise((resolve) => {
        resizeCanvas.toBlob(resolve, 'image/jpeg', quality);
      });
 
      if (resultBlob.size <= maxBytes) {
        return resultBlob;
      }
 
      // まず画質を下げ、下げきったら寸法を縮小して再試行
      if (quality > 0.5) {
        quality -= 0.1;
      } else {
        width = Math.round(width * 0.8);
        height = Math.round(height * 0.8);
      }
    }
 
    // 規定回数内で収まらなかった場合は最後の結果を返す
    return resultBlob;
  }
 
  /**
   * Blobをアップロードし、レスポンスからfile_idを取得する
   * ※ レスポンスの構造（file_idというキー名かどうか等）はAPIごとに
   *   異なるため、実際に使用するAPIの仕様に合わせて調整してください
   * @param {Blob} blob - アップロードする画像Blob
   * @param {string} uploadUrl - アップロード先のAPIエンドポイント
   * @param {string} fieldName - フォームのフィールド名（デフォルト: "file"）
   * @returns {Promise<string>} 取得したfile_id
   */
  async function uploadAndGetFileId(blob, uploadUrl, fieldName = 'file') {
    const formData = new FormData();
    formData.append(fieldName, blob, 'capture.jpg');

    let res;
    try {
      res = await fetch(uploadUrl, {
        method: 'POST',
        mode: 'cors',
        credentials: 'omit',
        body: formData
      });
    } catch (networkErr) {
      // "TypeError: Load failed"はサーバーに到達すらできていない状態。
      // 多くの場合、バックエンド(server.js)がまだ起動していないか、
      // Codespaceの名前が変わってURLが一致していないことが原因。
      throw new Error(
        `バックエンド(${uploadUrl})への接続に失敗しました。node server.jsが起動しているか、` +
        `Codespaceのポート転送URLが正しいか確認してください。詳細: ${networkErr.message}`
      );
    }

    if (!res.ok) {
      throw new Error(`アップロードに失敗しました: ${res.status}`);
    }

    const data = await res.json();
    return data.file_id; // APIのレスポンス構造に合わせて調整
  }

  test.addEventListener('click', async () => {
    try {
      status.textContent = 'アップロード中...';
      const resizedBlob = await resizeToJpegUnderSize(capturedBlob);
      const fileId = await uploadAndGetFileId(resizedBlob, UPLOAD_URL);
      console.log('[main] Uploaded file_id:', fileId);
      status.textContent = 'アップロード完了: ' + fileId;
      // const taskId = await startTask(await getSendableImageUrl());
      // const final = await pollTask(taskId);
      // console.log('[main] Final response:', final);
      // const ctx = canvas2.getContext('2d');
      // ctx.drawImage(final.output[0].url, 0, 0, canvas.width, canvas.height);
    } catch (e) {
      console.error('[main] Flow error:', e);
      status.textContent = 'エラー: ' + e.message;
      alert('Sorry, something went wrong:\n' + e.message);
    }
  });
  startBtn.addEventListener('click', async () => {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
      status.textContent = 'カメラは停止中です';
      startBtn.textContent = 'カメラを開始';
      captureBtn.disabled = true;
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      status.textContent = 'カメラ映像を表示中';
      startBtn.textContent = 'カメラを停止';
      captureBtn.disabled = false;
    } catch (err) {
      status.textContent = 'カメラへのアクセスに失敗しました: ' + err.message;
    }
  });

  captureBtn.addEventListener('click', () => {
    if (!stream) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob((blob) => {
      capturedBlob = blob;
      // 古いURLが残っていれば解放してからメモリリークを防ぐ
      if (capturedImageUrl) {
        URL.revokeObjectURL(capturedImageUrl);
      }

      // PNG画像のURLを変数に保存し、imgタグに描画する
      capturedImageUrl = URL.createObjectURL(blob);
      preview.src = capturedImageUrl;
      preview.style.display = 'block';

      downloadLink.href = capturedImageUrl;
      const ts = new Date().toISOString().replace(/[:.]/g, '-');
      downloadLink.download = `capture-${ts}.png`;
      downloadLink.style.display = 'inline-block';

      status.textContent = 'PNG画像をimgタグに描画しました';
      alert(capturedImageUrl.slice(5,capturedImageUrl.length-1));
    }, 'image/png');
    test.disabled=false;
  });
</script>
</body>
</html>
