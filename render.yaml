# Renderの設定をリポジトリ側に置いたもの(Blueprint)。
# ダッシュボードで手入力する代わりに、New > Blueprint からこのファイルを
# 読み込ませると、起動コマンドの打ち間違いを防げる。
#
# すでに手でWeb Serviceを作ってある場合は、Settings > Build & Deploy の
# Start Command を下の startCommand と同じにすること。
#
# このとき、入力欄を一度すべて消してから打ち直すこと。Renderの入力欄には
# `node index.js` のような既定値が入っていることがあり、後半だけを
# 書き換えると `node start` や `node run start` という命令になる。
# どちらも「start / run というファイルをNodeで実行しろ」という意味で、
#   Error: Cannot find module '/opt/render/project/src/start'
# となって起動に失敗する。`node ` が前に残っていないか必ず確かめること。
# (保険としてリポジトリ直下に start.js を置いてあるため `node start` でも
#  起動はするが、設定自体は下の startCommand に直しておくこと)
services:
  - type: web
    name: aging-demo
    runtime: node
    plan: starter        # 無料プランは15分でスリープし、aging APIからの画像取得に失敗する
    branch: main
    buildCommand: npm install
    startCommand: node server.js   # npm start と同じ(npm経由でない分こちらが確実)
    healthCheckPath: /healthz   # 認証と公開パスの外に置いてある
    envVars:
      # 値はダッシュボードで入力する(リポジトリには置かない)
      - key: AGING_API_KEY
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: APP_BASE_PATH
        sync: false
