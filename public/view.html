<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>閲覧ブース</title>
<link rel="stylesheet" href="booth.css">
<style>
  /*
   * 職員が数人分をまとめて入れ替える前提の画面。
   * 1画面を人数分に区切り、各区画に番号と結果画像を並べる。
   */
  /*
   * 閲覧ブースは離れた場所から見る展示物なので、画面いっぱいを使う。
   * booth.css の max-width: 900px は手元で読む画面向けの値で、
   * 2560×1600 や 2360×1640 のディスプレイでは結果が中央の900pxに
   * 押し込められて小さくなってしまう。
   */
  .booth {
    max-width: none;
    padding-inline: 2vw;
    padding-block: 2vh 1.5vh;
    gap: 1.4vh;
  }

  /*
   * 人数ぶんの区画を、上下2段までに分けて並べる(applyLayout)。
   * 奇数のときは上段が1枚多くなるので、段ごとに枚数が違う。
   * 格子(grid)だと段ごとに枚数を変えられないため、段を横並びの箱にして
   * それぞれ中央に寄せる。区画の大きさは両段で同じ値をJSで決める。
   */
  .slots {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 0.7vw;
  }
  .slot-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.7vw;
  }
  /* 待機画面は背景の演出だけを見せる(結果の区画も出さない) */
  .slots.is-waiting { display: none; }

  /*
   * 区画は写真そのもの。番号と年齢は写真の上に重ねて、
   * 面積をすべて写真に回す。
   */
  .slot {
    position: relative;
    flex: none;
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    min-height: 0;
    min-width: 0;
  }
  .slot.is-empty {
    border: 2px dashed var(--line);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: clamp(16px, 1.6vw, 22px);
  }
  /* 開発モードの見本。本番の写真と見間違えないよう枠で示す */
  .slot.is-placeholder {
    outline: 3px dashed rgba(255, 196, 0, 0.9);
    outline-offset: -3px;
  }
  /* 開発モードで、加工できずに元の写真を出しているもの */
  .slot.is-fallback {
    outline: 3px dashed rgba(226, 104, 92, 0.95);
    outline-offset: -3px;
  }

  /*
   * 本日の受付を終えたときの掲示。
   *
   * 閲覧ブースは遠くから見る画面なので、待機演出の上に大きく重ねる。
   * 結果の区画は隠す(締め切ったあとに誰かの写真が残っていると、
   * まだ続いていると思われてしまうため)。
   */
  .closed-notice {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2vh;
    text-align: center;
  }
  .closed-title {
    margin: 0;
    /* 画面の端まで来ないよう、幅いっぱいではなく少し内側に収める */
    max-width: 92%;
    font-size: clamp(34px, 6.2vw, 96px);
    font-weight: 700;
    line-height: 1.2;
    text-wrap: balance;
    color: #ffffff;
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.75);
  }
  .closed-lead {
    margin: 0;
    max-width: 80%;
    font-size: clamp(20px, 2.8vw, 38px);
    line-height: 1.6;
    text-wrap: balance;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
  }
  /* 掲示を出している間は結果の区画を出さない */
  body.is-closed .slots { display: none !important; }

  /* 開発モードである旨。会場で出したままにしないための目印 */
  .dev-banner {
    position: fixed;
    right: 12px;
    top: 0;
    z-index: 30;
    padding: 5px 14px;
    border-radius: 0 0 12px 12px;
    background: rgba(255, 196, 0, 0.92);
    color: #1b1b1b;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  /* 番号は写真の左上に重ねる。読めるよう背景を敷く */
  .slot-number {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 5px 13px 7px 11px;
    border-radius: 16px 0 14px 0;
    background: rgba(18, 21, 26, 0.72);
    line-height: 1.1;
  }
  .slot-number .num {
    font-size: clamp(28px, 2.6vw, 44px);
    font-weight: 700;
    line-height: 1;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .slot-number .label {
    font-size: clamp(12px, 1vw, 16px);
    color: rgba(255, 255, 255, 0.82);
    white-space: nowrap;
  }

  .photos {
    position: absolute;
    inset: 0;
    display: flex;
    min-width: 0;
  }
  .photo {
    flex: 1;
    min-width: 0;
    position: relative;
  }
  /*
   * 区画いっぱいに広げる。撮影ブースから送るのはカメラのフレーム
   * (横長)なので、生成結果も横長で返る。横長の区画に contain で
   * 収めれば、切り取らずにほぼ全面を使える。
   * 元より大きく引き伸ばすことは許す。展示用の大画面では、
   * 原寸に留めると遠くから見えないため。
   */
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  /* 年齢は写真の右下に重ねる */
  .photo .age {
    position: absolute;
    right: 0;
    bottom: 0;
    z-index: 1;
    padding: 4px 11px 6px 13px;
    border-radius: 14px 0 16px 0;
    background: rgba(18, 21, 26, 0.72);
    color: #ffffff;
    font-size: clamp(15px, 1.5vw, 22px);
    font-weight: 700;
    line-height: 1.2;
  }
  .photo.is-current .age { color: var(--accent); }
  .photo .now {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
  }

  /* 待機中に流す海中の演出。結果を出しているときは控えめにする */
  #ocean {
    position: fixed;
    inset: 0;
    z-index: -1;
    width: 100%;
    height: 100%;
    transition: opacity 1.2s ease;
  }
  #ocean.is-dimmed { opacity: 0.35; }
  @media (prefers-reduced-motion: reduce) {
    #ocean { transition: none; }
  }

  /* 絵柄によって背景の明るさが変わるため、見出しに影を付けて読めるようにする */
  .booth-header h1,
  .booth-header .subtitle,
  .staff-bar {
    text-shadow: 0 2px 8px rgba(2, 20, 31, 0.85);
  }

  /* 演出が見えるよう、待機中の区画は半透明にする */
  .slot { background: rgba(31, 36, 42, 0.86); }
  .slot.is-empty {
    background: rgba(21, 24, 28, 0.35);
    backdrop-filter: blur(2px);
  }
  body { background: #04141f; }

  /* 明るい絵柄のときは、白い紙の上に置いたような配色にする */
  body.is-light { background: #eef8fd; }
  body.is-light .booth-header h1,
  body.is-light .booth-header .subtitle,
  body.is-light .staff-bar {
    color: #2a5468;
    text-shadow: 0 1px 6px rgba(255, 255, 255, 0.9);
  }
  body.is-light .slot {
    background: rgba(255, 255, 255, 0.88);
    color: #2a5468;
  }
  body.is-light .slot.is-empty {
    background: rgba(255, 255, 255, 0.5);
    border-color: rgba(120, 180, 210, 0.7);
    color: #5b8ba3;
  }
  body.is-light .staff-bar { color: #5b8ba3; }
  /* 明るい絵柄では、白のままだと最終更新の時刻が読めない */
  body.is-light .staff-bar .count { color: #2a5468; }
  body.is-tamatebako .staff-bar .count { color: #ffffff; }

  /*
   * 絵柄 tamatebako。浜辺と玉手箱の絵(backgrounds/aging_viewBackground.jpg)を
   * 背景に敷き、その右上に広がる煙の部分へ結果の写真を並べる。
   * 煙そのもの(#ocean)は絵の上に重ねて描くため、他の絵柄と重ね順が逆になる。
   */
  /*
   * 玉手箱の背景。ふたの開き具合ごとに絵を用意し、重ねて置いて
   * 不透明度で入れ替える。canvasで描いたふたを重ねるより、
   * 絵そのものを差し替えるほうが絵柄を壊さない。
   * どの絵も同じ寸法・同じ構図であることが前提。
   */
  #backdrop {
    position: fixed;
    inset: 0;
    z-index: -2;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  body.is-tamatebako #backdrop { opacity: 1; }
  #backdrop .layer {
    position: absolute;
    inset: 0;
    /* 中央合わせ。tamatebako-scene.js が煙の出どころをこの前提で計算する */
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    opacity: 0;
    /* 入れ替えは早めに済ませる。ふたを開けた絵をしばらく見せたいため */
    transition: opacity 0.8s ease;
  }
  #backdrop .layer.is-on { opacity: 1; }
  #backdrop .layer[data-layer="closed"] {
    background-image: url('backgrounds/aging_viewBackground_closed.jpg');
  }
  #backdrop .layer[data-layer="opened"] {
    background-image: url('backgrounds/aging_viewBackground_opened.jpg');
  }
  #backdrop .layer[data-layer="smoke"] {
    background-image: url('backgrounds/aging_viewBackground.jpg');
  }
  @media (prefers-reduced-motion: reduce) {
    #backdrop .layer { transition: none; }
  }
  /*
   * 煙は演出の間だけ写真より手前に置く(is-front)。
   * 煙が晴れて写真が見えてくる見せ方なので、覆っている間に写真が
   * 煙の上に出ていると透けてしまう。
   * 演出が終わったら後ろへ回す。前に出たまま漂わせると、結果の写真が
   * 白くかすんでしまうため。canvasは操作を受けないので前後どちらでもよい。
   */
  body.is-tamatebako #ocean {
    z-index: 0;
    pointer-events: none;
    opacity: 1;
  }
  body.is-tamatebako #ocean.is-front { z-index: 2; }
  /* 煙の演出が主役なので、区画そのものは煙と同じ場所に重ねる */
  body.is-tamatebako .booth { position: relative; z-index: 1; }
  body.is-tamatebako .slots {
    /* 背景の絵で煙が広がっている範囲。ここに写真を置く。
       寄ったときに左の見出しへかぶらないよう、左端に余裕をとってある */
    position: absolute;
    /* 左右は同じ値で対に指定する。幅で決めると、指定の取り方によって
       左右の余白がずれるため */
    left: 2%;
    right: 2%;
    top: 9%;
    width: auto;
    height: 84%;
    flex: none;
    gap: 14px;
    /* 見え始めるのは煙が晴れるからで、区画そのものは淡く出さない。
       ここに遷移をかけると、煙とは別に浮き上がって見えてしまう */
    transition: none;
  }
  /* 煙が立ちのぼりきるまでは出さない。覆われてから煙の下に置く */
  body.is-tamatebako .slots.is-veiled { opacity: 0; }
  body.is-tamatebako .slot {
    background: rgba(255, 255, 255, 0.5);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(120, 104, 150, 0.28);
    backdrop-filter: blur(3px);
    color: #4a3f63;
  }
  body.is-tamatebako .slot.is-empty {
    background: rgba(255, 255, 255, 0.24);
    border-color: rgba(255, 255, 255, 0.65);
    color: #6a5c85;
  }
  /* 番号と年齢は写真に重ねた暗いチップの上に出るため、色は共通のまま使う */
  /* 見出しと係員向けの行は、絵の空いている左上と下辺へ寄せる */
  /* 見出しは結果の上に1行で置く。面積は結果に回す */
  body.is-tamatebako .booth-header {
    position: absolute;
    left: 2%;
    top: 1%;
    right: 2%;
    display: flex;
    align-items: baseline;
    gap: 16px;
    text-align: left;
  }
  body.is-tamatebako .booth-header h1 {
    font-size: clamp(20px, 2vw, 34px);
    white-space: nowrap;
    margin: 0;
  }
  body.is-tamatebako .booth-header .subtitle {
    font-size: clamp(12px, 1.1vw, 17px);
    margin: 0;
  }
  /* 煙が出ている間は画面が白く飛ぶため、影を濃いめにして読めるようにする */
  body.is-tamatebako .booth-header h1,
  body.is-tamatebako .booth-header .subtitle {
    color: #ffffff;
    text-shadow: 0 2px 4px rgba(58, 48, 82, 0.9), 0 0 18px rgba(58, 48, 82, 0.75);
  }
  body.is-tamatebako .staff-bar {
    color: #ffffff;
    text-shadow: 0 2px 4px rgba(58, 48, 82, 0.9), 0 0 14px rgba(58, 48, 82, 0.7);
  }
  @media (prefers-reduced-motion: reduce) {
    body.is-tamatebako .slots { transition: none; }
  }
  /* 煙の中で読めるよう、区画の地を少し濃くする */
  body.is-tamatebako .slot { background: rgba(255, 255, 255, 0.62); }
</style>
</head>
<body>
  <div id="backdrop">
    <!-- ふたが閉じた状態。待機中はこれを映す -->
    <div class="layer" data-layer="closed"></div>
    <!-- ふたを開けた直後。まだ煙は立っていない -->
    <div class="layer" data-layer="opened"></div>
    <!-- 煙が出た状態。ここからは演出が終わるまでこれ -->
    <div class="layer" data-layer="smoke"></div>
  </div>
  <canvas id="ocean"></canvas>
  <div class="dev-banner" id="devBanner" hidden>開発モード（表示は見本です）</div>
  <div class="booth">
    <div class="booth-header">
      <h1>未来のあなた</h1>
      <p class="subtitle" id="subtitle">画面の番号をお探しください</p>
    </div>

    <div class="slots" id="slots"></div>

    <!--
      本日の受付を終えたときだけ出る掲示。係員画面の「本日の受付を終了」か、
      決めておいた人数に達したときに、サーバーからの状態を見て出る。
    -->
    <div class="closed-notice" id="closedNotice" hidden>
      <p class="closed-title">本日の展示は終了しました</p>
      <p class="closed-lead" id="closedLead">ご来場いただきありがとうございました。</p>
    </div>

    <div class="staff-bar">
      <span>閲覧ブース</span>
      <span>最終更新 <span class="count" id="updatedAt">—</span></span>
      <span>表示は係員が入れ替えます</span>
    </div>
  </div>

<script src="common.js"></script>
<script src="ocean-scene.js"></script>
<script src="tamatebako-scene.js"></script>
<script>
  const slotsEl = document.getElementById('slots');
  const devBanner = document.getElementById('devBanner');
  const closedNotice = document.getElementById('closedNotice');
  const closedLead = document.getElementById('closedLead');
  const subtitle = document.getElementById('subtitle');
  const updatedAtEl = document.getElementById('updatedAt');

  // 表示内容が入れ替わっていないか確認する間隔
  const POLL_MS = 3000;

  // 閲覧ブースで見せる年齢。aging APIは複数の年齢を返すが、
  // 展示では1枚だけを大きく見せる。
  const DISPLAY_AGE = 70;

  // 結果画像の縦横比。撮影ブースが送るのはカメラのフレームなので横長で
  // 返る。実際の画像が届いたらその値に直す(下の adoptPhotoAspect)。
  let photoAspect = 16 / 9;

  let slotCount = 0;
  let lastUpdatedAt = null;
  let lastMode = null;
  let rendered = false;

  /**
   * 人数を上下2段に振り分ける。
   *
   *  1人   … 段に分けず、画面いっぱいに1枚
   *  2人   … 上下ではなく左右に1枚ずつ。画面は横長なので、縦に積むより
   *           横に並べたほうが1枚を大きく出せる
   *  3人以上… 上下2段。奇数のときは上段を1枚多くする(3人なら2+1)
   *
   * 1枚を大きく見せたいので、段を増やして小さくすることはしない。
   * @param {number} count
   * @returns {number[]} 段ごとの枚数
   */
  function rowsFor(count) {
    if (count <= 2) return [Math.max(count, 0)];
    return [Math.ceil(count / 2), Math.floor(count / 2)];
  }

  /**
   * 人数に応じて区画の大きさを決める。
   *
   * 区画は写真と同じ形にして、白い帯が出ないようにする。
   * 両方の段で同じ大きさになるよう、枚数の多い段を基準に幅を決める。
   * 画面の形や写真の縦横比で変わるので、表示のたびと画面が変わるたびに
   * 計算し直す。
   * @param {number} count
   */
  function applyLayout(count) {
    slotCount = count;
    const rect = slotsEl.getBoundingClientRect();
    if (!rect.width || !rect.height || count <= 0) return;

    const gap = parseFloat(getComputedStyle(slotsEl).rowGap) || 0;
    const rows = rowsFor(count);
    const widest = Math.max(...rows);

    const cellWidth = (rect.width - gap * (widest - 1)) / widest;
    const cellHeight = (rect.height - gap * (rows.length - 1)) / rows.length;
    const width = Math.max(1, Math.min(cellWidth, cellHeight * photoAspect));
    const height = width / photoAspect;

    for (const slot of slotsEl.querySelectorAll('.slot')) {
      slot.style.width = `${width}px`;
      slot.style.height = `${height}px`;
    }
  }

  /**
   * 実際に届いた画像の縦横比を、区画の大きさに取り込む。
   * 目安と大きく違ったときだけ並べ直す(毎回やると無駄に組み直すため)。
   * @param {number} aspect
   */
  function adoptPhotoAspect(aspect) {
    if (!aspect || Math.abs(aspect - photoAspect) / photoAspect < 0.05) return;
    photoAspect = aspect;
    if (slotCount > 0) applyLayout(slotCount);
  }

  function buildSlot(entry) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    // 開発モードで埋めた見本。番号も写真も本物ではない
    if (entry.placeholder) slot.classList.add('is-placeholder');
    // 開発モードで、加工できずに元の写真をそのまま出しているもの
    if (entry.fallback) slot.classList.add('is-fallback');

    const header = document.createElement('div');
    header.className = 'slot-number';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(entry.sequence);
    const label = document.createElement('span');
    label.className = 'label';
    if (entry.placeholder) label.textContent = '番（見本）';
    else if (entry.fallback) label.textContent = '番（未加工）';
    else label.textContent = '番の方';
    header.append(num, label);

    const photos = document.createElement('div');
    photos.className = 'photos';

    const output = pickOutput(entry);
    if (output) {
      const photo = document.createElement('div');
      photo.className = 'photo';

      // 加工できなかったものは年齢を持たない。その旨を出す
      const ageText = output.res_age === null ? '加工前の写真' : `${output.res_age}歳`;

      const img = document.createElement('img');
      img.src = resolveImageUrl(output.url);
      img.alt = ageText;
      img.addEventListener('load', () => {
        if (!img.naturalWidth || !img.naturalHeight) return;
        adoptPhotoAspect(img.naturalWidth / img.naturalHeight);
      });
      img.addEventListener('error', () => {
        logEvent({ level: 'error', event: 'image:load', sequence: entry.sequence, message: `${ageText}を表示できません` });
      });

      const age = document.createElement('div');
      age.className = 'age';
      age.textContent = ageText;

      photo.append(img, age);
      photos.append(photo);
    }

    slot.append(header, photos);
    return slot;
  }

  /**
   * 表示する1枚を選ぶ。DISPLAY_AGE と同じものを使い、
   * 無ければ最も近い年齢で代える(APIが返す年齢は依頼内容で変わるため)。
   * @param {object} entry
   */
  function pickOutput(entry) {
    if (entry.outputs.length === 0) return null;
    // 年齢を持たないもの(加工前の写真)は1枚しかないので、そのまま使う
    if (entry.outputs.length === 1) return entry.outputs[0];
    return entry.outputs.reduce((best, output) =>
      Math.abs(output.res_age - DISPLAY_AGE) < Math.abs(best.res_age - DISPLAY_AGE) ? output : best
    );
  }

  function render(display) {
    // 待機画面のときは背景の演出だけにする。区画は組み立てず、枠も出さない
    const showingResults = display.mode === 'results';
    // 開発モード中は画面の上端に出し続ける。本番で出したままにしないため
    devBanner.hidden = !display.dev_mode;
    slotsEl.classList.toggle('is-waiting', !showingResults);

    if (showingResults) {
      // 並べるのは届いている人数ぶんだけ。空きは作らない
      // (4人なら4枚で画面を使い切る)
      const entries = display.entries;
      const rows = rowsFor(entries.length);
      let index = 0;
      const children = rows.filter((n) => n > 0).map((n) => {
        const row = document.createElement('div');
        row.className = 'slot-row';
        row.append(...entries.slice(index, index + n).map(buildSlot));
        index += n;
        return row;
      });
      slotsEl.replaceChildren(...children);
      applyLayout(entries.length);
    } else {
      slotsEl.replaceChildren();
    }

    // 締め切りの掲示を出している間は、その案内を残す
    if (!showingClosedNotice) {
      subtitle.textContent = showingResults
        ? '画面の番号をお探しください'
        : '次のご案内までしばらくお待ちください';
    }
    // 待機中は背景の演出をはっきり見せ、結果を出している間は控えめにする
    document.getElementById('ocean').classList.toggle('is-dimmed', showingResults);

    updatedAtEl.textContent = display.updated_at
      ? new Date(display.updated_at).toLocaleTimeString('ja-JP')
      : '—';
  }

  /*
   * ---- 本日の受付終了 ----
   *
   * 係員画面の「本日の受付を終了」か、決めておいた人数に達したときに、
   * サーバーが締め切りの状態を返してくる。
   *
   * **掲示を出すのは待機画面のときだけ。** 締め切ったあとも、すでに撮り終えて
   * 移動中の人が残っている。その最後の組を係員が出しきれるよう、結果画面に
   * 移している間は今までどおり写真を並べる(玉手箱の演出もそのまま出す)。
   * 出し終えて待機画面に戻した時点で、掲示に変わる。
   *
   * 撮影ブースは締め切った時点ですぐ止まるので、これ以上人は増えない。
   */

  // 本日の受付を終えているか。サーバーの値で毎回上書きする
  let serviceClosed = false;
  // いま掲示を出しているか(締め切っていて、かつ待機画面のとき)
  let showingClosedNotice = false;

  /**
   * 締め切りの状態を画面に反映する。
   * @param {object} display - /api/display の応答
   */
  function applyServiceClosed(display) {
    const service = display.service || null;
    serviceClosed = service?.closed === true;
    // 結果を出している間は掲示を出さない(最後の組を出しきるため)
    const show = serviceClosed && display.mode !== 'results';
    if (show === showingClosedNotice) return;
    showingClosedNotice = show;

    document.body.classList.toggle('is-closed', show);
    closedNotice.hidden = !show;

    if (show) {
      closedLead.textContent = service.reason === 'limit'
        ? '本日お受けできる人数に達しました。ご来場いただきありがとうございました。'
        : 'ご来場いただきありがとうございました。';
      subtitle.textContent = '本日の受付は終了しました';
      ocean.classList.remove('is-dimmed');
      logEvent({ level: 'warn', event: 'service:closed', message: '本日の受付終了の掲示を表示' });
    } else {
      // 掲示を下げたら、いまの表示内容で組み直す
      rendered = false;
      logEvent({ event: 'service:open', message: '本日の受付終了の掲示を解除' });
    }
  }

  async function poll() {
    try {
      const display = await callApi('/api/display');
      // 待機演出の絵柄は表示内容とは独立に切り替わる
      applyOceanTheme(display.theme);
      applyServiceClosed(display);

      // 内容が変わったときだけ描き直す(画像の再読み込みを避ける)。
      // 初回は係員がまだ一度も更新していなくても、空きスロットを出しておく。
      if (!rendered || display.updated_at !== lastUpdatedAt || display.mode !== lastMode) {
        const first = !rendered;
        rendered = true;
        lastUpdatedAt = display.updated_at;
        lastMode = display.mode;

        // 玉手箱の絵柄では、係員が結果画面に移す操作を煙の演出で見せる。
        // 初回表示と、待機画面へ戻すときはそのまま切り替える。
        if (!first && currentTheme === 'tamatebako' && display.mode === 'results') {
          playReveal(display);
        } else {
          if (currentTheme === 'tamatebako' && display.mode !== 'results') {
            // 煙を消し、ふたを閉じた絵へ戻す
            tamatebakoScene.close();
            ocean.classList.remove('is-front');
            setBackdrop('closed');
          }
          render(display);
        }
        logEvent({
          event: 'display:rendered',
          message: display.mode === 'results' ? `${display.entries.length}件を表示` : '待機画面'
        });
      }
    } catch (err) {
      subtitle.textContent = 'サーバーに接続できません。係員をお呼びください';
    }
  }

  // ---- 待機中の演出 ----
  // 海中の絵柄(realistic / storybook / picturebook)は ocean-scene.js が、
  // 玉手箱の絵柄(tamatebako)は tamatebako-scene.js が描く。
  // 海中の絵柄は撮影ブースの背景合成でも同じモジュールを使い、
  // 撮る側と見る側で同じ世界を映す。
  // 結果を表示している間は薄くして、写真の邪魔をしない。

  const ocean = document.getElementById('ocean');
  const backdropLayers = document.querySelectorAll('#backdrop .layer');
  const oceanScene = createOceanScene(ocean);
  const tamatebakoScene = createTamatebakoScene(ocean, { onPhase: onRevealPhase });

  let currentTheme = 'realistic';
  // 煙に覆われている間に差し替える内容を持っておく
  let pendingDisplay = null;

  /**
   * 背景の絵を切り替える。指定した層だけを表示し、他は消す。
   * 用意していない層を指定した場合は、いま出ているものを変えない。
   * @param {string} name - closed | opened | smoke
   */
  function setBackdrop(name) {
    const target = [...backdropLayers].find((layer) => layer.dataset.layer === name);
    if (!target) return;
    for (const layer of backdropLayers) {
      layer.classList.toggle('is-on', layer === target);
    }
  }

  /**
   * 今の絵柄を描いているモジュール。
   */
  function activeScene() {
    return currentTheme === 'tamatebako' ? tamatebakoScene : oceanScene;
  }

  /**
   * 係員画面から指定された絵柄に切り替える。
   */
  function applyOceanTheme(theme) {
    if (!theme || theme === currentTheme) return;
    const known = OCEAN_THEMES.includes(theme) || theme === 'tamatebako';
    if (!known) return;

    activeScene().stop();
    currentTheme = theme;
    document.body.classList.toggle('is-light', theme === 'picturebook');
    document.body.classList.toggle('is-tamatebako', theme === 'tamatebako');
    // 絵柄をまたぐと区画の置き場所が変わるため、演出の途中の状態は畳んでおく
    slotsEl.classList.remove('is-veiled');

    if (theme === 'tamatebako') {
      // 待機中はふたが閉じた絵から始める
      setBackdrop('closed');
    } else {
      oceanScene.setTheme(theme);
    }
    resizeOcean();
    activeScene().start();
    logEvent({ event: 'display:theme', message: `待機演出を ${theme} に切り替え` });
  }

  /**
   * 玉手箱の演出。ふたを開け、煙で画面を埋め尽くし、覆われている隙に
   * 背景と結果を入れ替えて、煙が晴れる中で結果が現れるようにする。
   */
  function playReveal(display) {
    pendingDisplay = display;
    // ふたが開いて煙が立ちのぼっている間は区画を見せない
    slotsEl.classList.add('is-veiled');
    // 演出の間は煙を写真より手前に置き、覆い隠す役をさせる
    ocean.classList.add('is-front');
    tamatebakoScene.play();
  }

  /**
   * tamatebako-scene.js から演出の各段階を受け取る。
   *
   * 見せ方の順序:
   *   1. 玉手箱を開ける      (lifting)  ふたのない絵へ入れ替える
   *   2. 煙を画面いっぱいに  (rising / filling)
   *                          背景はふたのない絵のまま、結果も出さない
   *   3. 背景を煙ありの絵へ  (veiled)   煙に覆われている隙に入れ替える
   *   4. 結果を煙の下に置く  (veiled)   置くだけで、隠すのは煙に任せる
   *   5. 煙が晴れる          (settling) 晴れるにつれて結果が見えてくる
   *
   * 3と4を veiled だけに任せると、描画が飛んだときに背景も結果も出ないまま
   * 演出が終わってしまう。veiled 以降はどの段階を受け取っても同じ処理をする。
   */
  function onRevealPhase(phase) {
    // 1. ふたを開ける。煙より先に入れ替わりきるよう、最初の段階で始める
    if (phase === 'lifting') {
      setBackdrop('opened');
      slotsEl.classList.add('is-veiled');
      return;
    }

    // 2. 煙が広がりきるまでは、背景も中身もそのまま
    if (phase === 'rising' || phase === 'filling') {
      slotsEl.classList.add('is-veiled');
      return;
    }

    // 3. 覆われている間に、煙ありの絵へ替える(入れ替えは煙の下で終わる)
    setBackdrop('smoke');

    // 4. 結果を煙の下に置く
    if (pendingDisplay) {
      render(pendingDisplay);
      pendingDisplay = null;
    }

    // 5. あとは煙が晴れるのに任せる。区画の側では隠さない
    slotsEl.classList.remove('is-veiled');

    // 晴れきったら煙を写真の後ろへ回す。前に出たまま漂わせると
    // 結果の写真が白くかすむため、漂う煙は背景の側で見せる
    if (phase === 'done') {
      ocean.classList.remove('is-front');
    }
  }

  function resizeOcean() {
    activeScene().resize(window.innerWidth, window.innerHeight);
  }

  window.addEventListener('resize', () => {
    resizeOcean();
    // 画面の形が変われば区画の大きさも変わる
    if (slotCount > 0 && !slotsEl.classList.contains('is-waiting')) {
      applyLayout(slotCount);
    }
  });
  resizeOcean();
  activeScene().start();

  lockKiosk();
  startHeartbeat('view');
  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
