<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>閲覧ブース</title>
<link rel="stylesheet" href="booth.css">
<style>
  /*
   * 職員が数人分をまとめて入れ替える前提の画面。
   * 1画面を人数分に区切り、各区画に番号と結果画像を並べる。
   */
  /*
   * 閲覧ブースは離れた場所から見る展示物なので、画面いっぱいを使う。
   * booth.css の max-width: 900px は手元で読む画面向けの値で、
   * 2560×1600 や 2360×1640 のディスプレイでは結果が中央の900pxに
   * 押し込められて小さくなってしまう。
   */
  .booth {
    max-width: none;
    padding-inline: 2vw;
    padding-block: 2vh 1.5vh;
    gap: 1.4vh;
  }

  .slots {
    width: 100%;
    flex: 1;
    display: grid;
    gap: 0.7vw;
    /* 区画は写真と同じ形・同じ大きさにする(applyGrid)。
       余った分は上下左右に均等に残す */
    justify-content: center;
    align-content: center;
  }
  /* 待機画面は背景の演出だけを見せる(結果の区画も出さない) */
  .slots.is-waiting { display: none; }

  /*
   * 区画は写真そのもの。番号と年齢は写真の上に重ねて、
   * 面積をすべて写真に回す。
   */
  .slot {
    position: relative;
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    min-height: 0;
    min-width: 0;
  }
  .slot.is-empty {
    border: 2px dashed var(--line);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: clamp(16px, 1.6vw, 22px);
  }

  /* 番号は写真の左上に重ねる。読めるよう背景を敷く */
  .slot-number {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 5px 13px 7px 11px;
    border-radius: 16px 0 14px 0;
    background: rgba(18, 21, 26, 0.72);
    line-height: 1.1;
  }
  .slot-number .num {
    font-size: clamp(28px, 2.6vw, 44px);
    font-weight: 700;
    line-height: 1;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .slot-number .label {
    font-size: clamp(12px, 1vw, 16px);
    color: rgba(255, 255, 255, 0.82);
    white-space: nowrap;
  }

  .photos {
    position: absolute;
    inset: 0;
    display: flex;
    min-width: 0;
  }
  .photo {
    flex: 1;
    min-width: 0;
    position: relative;
  }
  /*
   * 区画いっぱいに広げる。撮影ブースから送るのはカメラのフレーム
   * (横長)なので、生成結果も横長で返る。横長の区画に contain で
   * 収めれば、切り取らずにほぼ全面を使える。
   * 元より大きく引き伸ばすことは許す。展示用の大画面では、
   * 原寸に留めると遠くから見えないため。
   */
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  /* 年齢は写真の右下に重ねる */
  .photo .age {
    position: absolute;
    right: 0;
    bottom: 0;
    z-index: 1;
    padding: 4px 11px 6px 13px;
    border-radius: 14px 0 16px 0;
    background: rgba(18, 21, 26, 0.72);
    color: #ffffff;
    font-size: clamp(15px, 1.5vw, 22px);
    font-weight: 700;
    line-height: 1.2;
  }
  .photo.is-current .age { color: var(--accent); }
  .photo .now {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
  }

  /* 待機中に流す海中の演出。結果を出しているときは控えめにする */
  #ocean {
    position: fixed;
    inset: 0;
    z-index: -1;
    width: 100%;
    height: 100%;
    transition: opacity 1.2s ease;
  }
  #ocean.is-dimmed { opacity: 0.35; }
  @media (prefers-reduced-motion: reduce) {
    #ocean { transition: none; }
  }

  /* 絵柄によって背景の明るさが変わるため、見出しに影を付けて読めるようにする */
  .booth-header h1,
  .booth-header .subtitle,
  .staff-bar {
    text-shadow: 0 2px 8px rgba(2, 20, 31, 0.85);
  }

  /* 演出が見えるよう、待機中の区画は半透明にする */
  .slot { background: rgba(31, 36, 42, 0.86); }
  .slot.is-empty {
    background: rgba(21, 24, 28, 0.35);
    backdrop-filter: blur(2px);
  }
  body { background: #04141f; }

  /* 明るい絵柄のときは、白い紙の上に置いたような配色にする */
  body.is-light { background: #eef8fd; }
  body.is-light .booth-header h1,
  body.is-light .booth-header .subtitle,
  body.is-light .staff-bar {
    color: #2a5468;
    text-shadow: 0 1px 6px rgba(255, 255, 255, 0.9);
  }
  body.is-light .slot {
    background: rgba(255, 255, 255, 0.88);
    color: #2a5468;
  }
  body.is-light .slot.is-empty {
    background: rgba(255, 255, 255, 0.5);
    border-color: rgba(120, 180, 210, 0.7);
    color: #5b8ba3;
  }
  body.is-light .staff-bar { color: #5b8ba3; }
  /* 明るい絵柄では、白のままだと最終更新の時刻が読めない */
  body.is-light .staff-bar .count { color: #2a5468; }
  body.is-tamatebako .staff-bar .count { color: #ffffff; }

  /*
   * 絵柄 tamatebako。浜辺と玉手箱の絵(backgrounds/aging_viewBackground.jpg)を
   * 背景に敷き、その右上に広がる煙の部分へ結果の写真を並べる。
   * 煙そのもの(#ocean)は絵の上に重ねて描くため、他の絵柄と重ね順が逆になる。
   */
  /*
   * 玉手箱の背景。ふたの開き具合ごとに絵を用意し、重ねて置いて
   * 不透明度で入れ替える。canvasで描いたふたを重ねるより、
   * 絵そのものを差し替えるほうが絵柄を壊さない。
   * どの絵も同じ寸法・同じ構図であることが前提。
   */
  #backdrop {
    position: fixed;
    inset: 0;
    z-index: -2;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  body.is-tamatebako #backdrop { opacity: 1; }
  #backdrop .layer {
    position: absolute;
    inset: 0;
    /* 中央合わせ。tamatebako-scene.js が煙の出どころをこの前提で計算する */
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    opacity: 0;
    /* 入れ替えは早めに済ませる。ふたを開けた絵をしばらく見せたいため */
    transition: opacity 0.8s ease;
  }
  #backdrop .layer.is-on { opacity: 1; }
  #backdrop .layer[data-layer="closed"] {
    background-image: url('backgrounds/aging_viewBackground_closed.jpg');
  }
  #backdrop .layer[data-layer="opened"] {
    background-image: url('backgrounds/aging_viewBackground_opened.jpg');
  }
  #backdrop .layer[data-layer="smoke"] {
    background-image: url('backgrounds/aging_viewBackground.jpg');
  }
  @media (prefers-reduced-motion: reduce) {
    #backdrop .layer { transition: none; }
  }
  body.is-tamatebako #ocean {
    z-index: 0;
    pointer-events: none;
    opacity: 1;
  }
  /* 煙の演出が主役なので、区画そのものは煙の中に浮かべる */
  body.is-tamatebako .booth { position: relative; z-index: 1; }
  body.is-tamatebako .slots {
    /* 背景の絵で煙が広がっている範囲。ここに写真を置く。
       寄ったときに左の見出しへかぶらないよう、左端に余裕をとってある */
    position: absolute;
    left: 2%;
    top: 9%;
    width: 96%;
    height: 84%;
    flex: none;
    gap: 14px;
    transition: opacity 0.9s ease;
  }
  /* 煙に覆われている間は写真を隠し、その隙に中身を入れ替える */
  body.is-tamatebako .slots.is-veiled { opacity: 0; transition: none; }
  body.is-tamatebako .slot {
    background: rgba(255, 255, 255, 0.5);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(120, 104, 150, 0.28);
    backdrop-filter: blur(3px);
    color: #4a3f63;
  }
  body.is-tamatebako .slot.is-empty {
    background: rgba(255, 255, 255, 0.24);
    border-color: rgba(255, 255, 255, 0.65);
    color: #6a5c85;
  }
  /* 番号と年齢は写真に重ねた暗いチップの上に出るため、色は共通のまま使う */
  /* 見出しと係員向けの行は、絵の空いている左上と下辺へ寄せる */
  /* 見出しは結果の上に1行で置く。面積は結果に回す */
  body.is-tamatebako .booth-header {
    position: absolute;
    left: 2%;
    top: 1%;
    right: 2%;
    display: flex;
    align-items: baseline;
    gap: 16px;
    text-align: left;
  }
  body.is-tamatebako .booth-header h1 {
    font-size: clamp(20px, 2vw, 34px);
    white-space: nowrap;
    margin: 0;
  }
  body.is-tamatebako .booth-header .subtitle {
    font-size: clamp(12px, 1.1vw, 17px);
    margin: 0;
  }
  /* 煙が出ている間は画面が白く飛ぶため、影を濃いめにして読めるようにする */
  body.is-tamatebako .booth-header h1,
  body.is-tamatebako .booth-header .subtitle {
    color: #ffffff;
    text-shadow: 0 2px 4px rgba(58, 48, 82, 0.9), 0 0 18px rgba(58, 48, 82, 0.75);
  }
  body.is-tamatebako .staff-bar {
    color: #ffffff;
    text-shadow: 0 2px 4px rgba(58, 48, 82, 0.9), 0 0 14px rgba(58, 48, 82, 0.7);
  }
  @media (prefers-reduced-motion: reduce) {
    body.is-tamatebako .slots { transition: none; }
  }
  /* 煙の中で読めるよう、区画の地を少し濃くする */
  body.is-tamatebako .slot { background: rgba(255, 255, 255, 0.62); }
</style>
</head>
<body>
  <div id="backdrop">
    <!-- ふたが閉じた状態。待機中はこれを映す -->
    <div class="layer" data-layer="closed"></div>
    <!-- ふたを開けた直後。まだ煙は立っていない -->
    <div class="layer" data-layer="opened"></div>
    <!-- 煙が出た状態。ここからは演出が終わるまでこれ -->
    <div class="layer" data-layer="smoke"></div>
  </div>
  <canvas id="ocean"></canvas>
  <div class="booth">
    <div class="booth-header">
      <h1>未来のあなた</h1>
      <p class="subtitle" id="subtitle">画面の番号をお探しください</p>
    </div>

    <div class="slots" id="slots"></div>

    <div class="staff-bar">
      <span>閲覧ブース</span>
      <span>最終更新 <span class="count" id="updatedAt">—</span></span>
      <span>表示は係員が入れ替えます</span>
    </div>
  </div>

<script src="common.js"></script>
<script src="ocean-scene.js"></script>
<script src="tamatebako-scene.js"></script>
<script>
  const slotsEl = document.getElementById('slots');
  const subtitle = document.getElementById('subtitle');
  const updatedAtEl = document.getElementById('updatedAt');

  // 表示内容が入れ替わっていないか確認する間隔
  const POLL_MS = 3000;

  // 閲覧ブースで見せる年齢。aging APIは複数の年齢を返すが、
  // 展示では1枚だけを大きく見せる。
  const DISPLAY_AGE = 70;

  // 結果画像の縦横比。撮影ブースが送るのはカメラのフレームなので横長で
  // 返る。実際の画像が届いたらその値に直す(下の adoptPhotoAspect)。
  let photoAspect = 16 / 9;

  let slotCount = 0;
  let lastUpdatedAt = null;
  let lastMode = null;
  let rendered = false;

  /**
   * 人数に応じて画面を区切る。
   *
   * 正方形に近い分割(√n)ではなく、写真がいちばん大きく収まる列数を選ぶ。
   * 結果は横長なので、区画が正方形に近いほど上下が余ってしまう。
   * 何列がよいかは画面の形で変わる(6人ならiPadは2列、MacBookは3列)ため、
   * 表示のたびと画面の大きさが変わったときに計算し直す。
   */
  function applyGrid(count) {
    slotCount = count;
    const rect = slotsEl.getBoundingClientRect();
    if (!rect.width || !rect.height) return;

    const gap = parseFloat(getComputedStyle(slotsEl).columnGap) || 0;
    const cols = bestColumnCount(count, rect.width, rect.height, gap);
    const rows = Math.ceil(count / cols);

    // 区画を写真と同じ形にして、白い帯が出ないようにする
    const cellWidth = (rect.width - gap * (cols - 1)) / cols;
    const cellHeight = (rect.height - gap * (rows - 1)) / rows;
    const width = Math.max(1, Math.min(cellWidth, cellHeight * photoAspect));
    const height = width / photoAspect;

    slotsEl.style.gridTemplateColumns = `repeat(${cols}, ${width}px)`;
    slotsEl.style.gridTemplateRows = `repeat(${rows}, ${height}px)`;
  }

  /**
   * 実際に届いた画像の縦横比を、列数の計算に取り込む。
   * 目安と大きく違ったときだけ並べ直す(毎回やると無駄に組み直すため)。
   * @param {number} aspect
   */
  function adoptPhotoAspect(aspect) {
    if (!aspect || Math.abs(aspect - photoAspect) / photoAspect < 0.05) return;
    photoAspect = aspect;
    if (slotCount > 0) applyGrid(slotCount);
  }

  /**
   * 区画に収まる写真がいちばん大きくなる列数を求める。
   * @param {number} count - 並べる人数
   * @param {number} width,height - 並べる領域の大きさ
   * @param {number} gap - 区画のすき間
   */
  function bestColumnCount(count, width, height, gap) {
    let best = { cols: Math.ceil(Math.sqrt(count)), area: 0 };
    for (let cols = 1; cols <= count; cols++) {
      const rows = Math.ceil(count / cols);
      const cellWidth = (width - gap * (cols - 1)) / cols;
      const cellHeight = (height - gap * (rows - 1)) / rows;
      if (cellWidth <= 0 || cellHeight <= 0) continue;
      // 区画に横長の写真を収めたときの大きさ
      const photoWidth = Math.min(cellWidth, cellHeight * photoAspect);
      const area = photoWidth * (photoWidth / photoAspect);
      if (area > best.area) best = { cols, area };
    }
    return best.cols;
  }

  function buildSlot(entry) {
    const slot = document.createElement('div');
    slot.className = 'slot';

    const header = document.createElement('div');
    header.className = 'slot-number';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(entry.sequence);
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = '番の方';
    header.append(num, label);

    const photos = document.createElement('div');
    photos.className = 'photos';

    const output = pickOutput(entry);
    if (output) {
      const photo = document.createElement('div');
      photo.className = 'photo';

      const img = document.createElement('img');
      img.src = resolveImageUrl(output.url);
      img.alt = `${output.res_age}歳`;
      img.addEventListener('load', () => {
        if (!img.naturalWidth || !img.naturalHeight) return;
        adoptPhotoAspect(img.naturalWidth / img.naturalHeight);
      });
      img.addEventListener('error', () => {
        logEvent({ level: 'error', event: 'image:load', sequence: entry.sequence, message: `${output.res_age}歳の画像を表示できません` });
      });

      const age = document.createElement('div');
      age.className = 'age';
      age.textContent = `${output.res_age}歳`;

      photo.append(img, age);
      photos.append(photo);
    }

    slot.append(header, photos);
    return slot;
  }

  /**
   * 表示する1枚を選ぶ。DISPLAY_AGE と同じものを使い、
   * 無ければ最も近い年齢で代える(APIが返す年齢は依頼内容で変わるため)。
   * @param {object} entry
   */
  function pickOutput(entry) {
    if (entry.outputs.length === 0) return null;
    return entry.outputs.reduce((best, output) =>
      Math.abs(output.res_age - DISPLAY_AGE) < Math.abs(best.res_age - DISPLAY_AGE) ? output : best
    );
  }

  function buildEmptySlot() {
    const slot = document.createElement('div');
    slot.className = 'slot is-empty';
    slot.textContent = '準備中';
    return slot;
  }

  function render(display) {
    // 待機画面のときは背景の演出だけにする。区画は組み立てず、枠も出さない
    const showingResults = display.mode === 'results';
    slotsEl.classList.toggle('is-waiting', !showingResults);

    if (showingResults) {
      applyGrid(display.slot_count);
      const children = [];
      for (let i = 0; i < display.slot_count; i++) {
        const entry = display.entries[i];
        children.push(entry ? buildSlot(entry) : buildEmptySlot());
      }
      slotsEl.replaceChildren(...children);
    } else {
      slotsEl.replaceChildren();
    }

    subtitle.textContent = showingResults
      ? '画面の番号をお探しください'
      : '次のご案内までしばらくお待ちください';
    // 待機中は背景の演出をはっきり見せ、結果を出している間は控えめにする
    document.getElementById('ocean').classList.toggle('is-dimmed', showingResults);

    updatedAtEl.textContent = display.updated_at
      ? new Date(display.updated_at).toLocaleTimeString('ja-JP')
      : '—';
  }

  async function poll() {
    try {
      const display = await callApi('/api/display');
      // 待機演出の絵柄は表示内容とは独立に切り替わる
      applyOceanTheme(display.theme);

      // 内容が変わったときだけ描き直す(画像の再読み込みを避ける)。
      // 初回は係員がまだ一度も更新していなくても、空きスロットを出しておく。
      if (!rendered || display.updated_at !== lastUpdatedAt || display.mode !== lastMode) {
        const first = !rendered;
        rendered = true;
        lastUpdatedAt = display.updated_at;
        lastMode = display.mode;

        // 玉手箱の絵柄では、係員が結果画面に移す操作を煙の演出で見せる。
        // 初回表示と、待機画面へ戻すときはそのまま切り替える。
        if (!first && currentTheme === 'tamatebako' && display.mode === 'results') {
          playReveal(display);
        } else {
          if (currentTheme === 'tamatebako' && display.mode !== 'results') {
            // 煙を消し、ふたを閉じた絵へ戻す
            tamatebakoScene.close();
            setBackdrop('closed');
          }
          render(display);
        }
        logEvent({
          event: 'display:rendered',
          message: display.mode === 'results' ? `${display.entries.length}件を表示` : '待機画面'
        });
      }
    } catch (err) {
      subtitle.textContent = 'サーバーに接続できません。係員をお呼びください';
    }
  }

  // ---- 待機中の演出 ----
  // 海中の絵柄(realistic / storybook / picturebook)は ocean-scene.js が、
  // 玉手箱の絵柄(tamatebako)は tamatebako-scene.js が描く。
  // 海中の絵柄は撮影ブースの背景合成でも同じモジュールを使い、
  // 撮る側と見る側で同じ世界を映す。
  // 結果を表示している間は薄くして、写真の邪魔をしない。

  const ocean = document.getElementById('ocean');
  const backdropLayers = document.querySelectorAll('#backdrop .layer');
  const oceanScene = createOceanScene(ocean);
  const tamatebakoScene = createTamatebakoScene(ocean, { onPhase: onRevealPhase });

  let currentTheme = 'realistic';
  // 煙に覆われている間に差し替える内容を持っておく
  let pendingDisplay = null;

  /**
   * 背景の絵を切り替える。指定した層だけを表示し、他は消す。
   * 用意していない層を指定した場合は、いま出ているものを変えない。
   * @param {string} name - closed | opened | smoke
   */
  function setBackdrop(name) {
    const target = [...backdropLayers].find((layer) => layer.dataset.layer === name);
    if (!target) return;
    for (const layer of backdropLayers) {
      layer.classList.toggle('is-on', layer === target);
    }
  }

  /**
   * 今の絵柄を描いているモジュール。
   */
  function activeScene() {
    return currentTheme === 'tamatebako' ? tamatebakoScene : oceanScene;
  }

  /**
   * 係員画面から指定された絵柄に切り替える。
   */
  function applyOceanTheme(theme) {
    if (!theme || theme === currentTheme) return;
    const known = OCEAN_THEMES.includes(theme) || theme === 'tamatebako';
    if (!known) return;

    activeScene().stop();
    currentTheme = theme;
    document.body.classList.toggle('is-light', theme === 'picturebook');
    document.body.classList.toggle('is-tamatebako', theme === 'tamatebako');
    // 絵柄をまたぐと区画の置き場所が変わるため、演出の途中の状態は畳んでおく
    slotsEl.classList.remove('is-veiled');

    if (theme === 'tamatebako') {
      // 待機中はふたが閉じた絵から始める
      setBackdrop('closed');
    } else {
      oceanScene.setTheme(theme);
    }
    resizeOcean();
    activeScene().start();
    logEvent({ event: 'display:theme', message: `待機演出を ${theme} に切り替え` });
  }

  /**
   * 玉手箱の演出。煙が画面を覆っている隙に写真を入れ替え、
   * 煙が晴れてしばらくしてから写真へ寄る。
   */
  function playReveal(display) {
    pendingDisplay = display;
    // ふたが開いて煙が立ちのぼっている間は区画を見せない
    slotsEl.classList.add('is-veiled');
    tamatebakoScene.play();
  }

  /**
   * tamatebako-scene.js から演出の各段階を受け取る。
   *
   * 差し替えを veiled だけに任せると、描画が飛んだときに写真が出ないまま
   * 演出が終わってしまう。veiled 以降はどの段階を受け取っても差し替える。
   */
  function onRevealPhase(phase) {
    const beforeVeil = phase === 'lifting' || phase === 'rising' || phase === 'filling';

    // ふたが持ち上がる段階で、開いた絵へ入れ替える。
    // 煙が立ちのぼるより前に切り替わりきるよう、最初の段階で始める
    if (phase === 'lifting') {
      setBackdrop('opened');
    } else if (phase === 'rising') {
      setBackdrop('smoke');
    }

    if (beforeVeil) {
      slotsEl.classList.add('is-veiled');
      return;
    }

    if (pendingDisplay) {
      render(pendingDisplay);
      pendingDisplay = null;
    }
    // 完全に覆われている間だけ隠し、薄れ始めたら見せる
    slotsEl.classList.toggle('is-veiled', phase === 'veiled');
  }

  function resizeOcean() {
    activeScene().resize(window.innerWidth, window.innerHeight);
  }

  window.addEventListener('resize', () => {
    resizeOcean();
    // 画面の形が変われば最適な列数も変わる
    if (slotCount > 0 && !slotsEl.classList.contains('is-waiting')) {
      applyGrid(slotCount);
    }
  });
  resizeOcean();
  activeScene().start();

  startHeartbeat('view');
  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
