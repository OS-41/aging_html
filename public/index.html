<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>展示用の入口</title>
<link rel="apple-touch-icon" href="icons/hub-180.png">
<link rel="icon" href="icons/hub-180.png">
<meta name="apple-mobile-web-app-title" content="入口">
<meta name="theme-color" content="#23282e">
<link rel="stylesheet" href="booth.css">
<style>
  /*
   * 設営のときだけ開く案内。来場者には見せない画面なので、
   * 大きなボタンは置かず、行き先の一覧と役割だけを並べる。
   */
  .booth { justify-content: center; }
  .links {
    list-style: none;
    padding: 0;
    margin: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .links a {
    display: block;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 16px 20px;
    color: var(--ink);
    text-decoration: none;
  }
  .links a:hover { background: #2a313a; }
  .links a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .links .path {
    font-size: 20px;
    font-weight: 600;
  }
  .links .what {
    display: block;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    margin-top: 2px;
  }
  .note {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    margin: 0;
    width: 100%;
  }
</style>
</head>
<body>
<div class="booth">
  <header class="booth-header">
    <h1>展示用の入口</h1>
    <p class="subtitle">設営用の案内です。来場者に見せる画面ではありません</p>
  </header>

  <ul class="links">
    <li>
      <a href="capture.html">
        <span class="path">撮影ブース &nbsp;/capture.html</span>
        <span class="what">写真を撮って受付番号を渡すところ。来場者が最初に触る画面</span>
      </a>
    </li>
    <li>
      <a href="view.html">
        <span class="path">閲覧ブース &nbsp;/view.html</span>
        <span class="what">結果を映すところ。係員が入れ替えるまで同じ内容を映し続ける</span>
      </a>
    </li>
    <li>
      <a href="staff.html">
        <span class="path">係員用 &nbsp;/staff.html</span>
        <span class="what">画面の切り替え・保管一覧・処理履歴。ここだけは来場者に見せない</span>
      </a>
    </li>
  </ul>

  <p class="note">
    各端末は、この一覧からではなく目的の画面のURLを直接開いて全画面にする。
    設営手順と当日の決まりごとは <code>README.md</code> を見る。
  </p>
</div>
</body>
</html>
